version: "3.8"

services:
  crm_api:
    image: crm-api:latest
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    command: ["node", "dist/server.js"]
    env_file:
      - .env
    networks:
      - talks_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.http.routers.crm_api.rule=Host(`api.agenciatalks.online`)
        - traefik.http.routers.crm_api.entrypoints=websecure
        - traefik.http.routers.crm_api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.crm_api.service=crm_api
        - traefik.http.services.crm_api.loadbalancer.server.port=3000
        - traefik.http.services.crm_api.loadbalancer.passHostHeader=true
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  crm_worker_webhook:
    image: crm-api:latest
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    command: ["node", "dist/workers/webhook.worker.js"]
    env_file:
      - .env
    networks:
      - talks_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M

  crm_worker_outbound:
    image: crm-api:latest
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    command: ["node", "dist/workers/outbound.worker.js"]
    env_file:
      - .env
    networks:
      - talks_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M

  crm_worker_automation:
    image: crm-api:latest
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    command: ["node", "dist/automation/automation.worker.js"]
    env_file:
      - .env
    networks:
      - talks_network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M

networks:
  talks_network:
    name: talks_network
    external: true
