name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://crm:crm@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

      - name: Lint
        run: npx oxlint src

      # Aplica as migrations versionadas num banco limpo e compara o
      # resultado com o schema.prisma — se alguém mudar o schema sem gerar
      # a migration correspondente, o PR falha aqui em vez de quebrar em
      # produção (foi exatamente assim que o incidente de 22/08 aconteceu).
      - name: Migrations em dia com o schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
